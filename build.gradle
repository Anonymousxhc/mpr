plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'io.research.mpvhbypass'
    compileSdk 34

    defaultConfig {
        applicationId 'io.research.mpvhbypass'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Provided by the framework at runtime; never packaged.
    compileOnly 'de.robv.android.xposed:api:82'
}
